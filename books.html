<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书馆数据</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <style>
    .chart-box { height: 360px; }
  </style>
</head>
<body class="container py-4">
  <a href="campus.html" class="btn btn-outline-secondary btn-sm mb-3">← 返回校园公共服务</a>
  <header>
    <h1 class="h3">图书馆借阅统计</h1>
    <p class="text-muted">数据来源：本地数据集（教学演示用）</p>
  </header>

  <section class="row g-3 mb-4" id="cards"></section>

  <section class="row g-3">
    <div class="col-lg-6">
      <h2 class="h5">各品类藏书与借阅量（柱状图）</h2>
      <div id="bar-chart" class="chart-box"></div>
    </div>
    <div class="col-lg-6">
      <h2 class="h5">各品类借阅占比（饼状图）</h2>
      <div class="chart-box" id="pie-chart"></div>
    </div>
  </section>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="books.js"></script>
</body>
</html>
